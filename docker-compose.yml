services:
    nestjs:
        container_name: nestjs
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        ports:
            - 3001:3001
        restart: always
        networks:
            - frontend_network

    backend:
        container_name: backend
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        volumes:
            - ./backend:/app
            - /app/node_modules
        environment:
            - DATABASE_URL=${DATABASE_URL}
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
            - PORT=3000
        restart: always
        networks:
            - frontend_network

    frontend:
        container_name: frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - VITE_API_URL=http://localhost:3000
        depends_on:
            - backend
        restart: always
        networks:
            - frontend_network

networks:
    frontend_network:
        driver: bridge
