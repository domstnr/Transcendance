services:
    nestjs:
        container_name: nestjs
        build: ./dockers/nestjs
        ports:
            - 3000:3000
        command: npm run start:dev
        volumes:
          - .:/usr/src/app
        restart: always
        networks:
            - frontend_network

    db:
        image: postgress
        environment:
        POSTGRES_USER: kenny
        POSTGRES_PASSWORD: password123
        POSTGRES_DB: transcendance

networks:
    frontend_network:
        driver: bridge
