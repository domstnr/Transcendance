services:
    nestjs:
        container_name: nestjs
        build: ./dockers/nestjs
        ports:
            - 3000:3000
        restart: always
        networks:
            - frontend_network
    postgresql:
        container_name: postgresql
        build: ./dockers/postgresql
        restart: always
        networks:
            - frontend_network

networks:
    frontend_network:
        driver: bridge